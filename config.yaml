# Indian Crypto Bot - Default Configuration
# Copy to config.yaml and fill in credentials, or use env var injection via entrypoint.sh

exchange:
  name: binance
  api_key: ""          # Set via BINANCE_API_KEY env var
  secret_key: ""      # Set via BINANCE_SECRET_KEY env var
  trading_mode: futures
  margin_mode: cross

telegram:
  enabled: true
  token: ""           # Set via FREQTRADE_TELEGRAM_TOKEN env var
  chat_id: ""         # Set via FREQTRADE_TELEGRAM_CHAT_ID env var

strategy:
  name: ATR_CHANNEL_2H
  timeframe: 2h
  max_open_trades: 4
  stake_currency: USDT
  stoploss: -0.99

pairlists:
  - method: StaticPairList
    pairs:
      - BTC/USDT:USDT
      - ETH/USDT:USDT
      - SOL/USDT:USDT
      - BNB/USDT:USDT
      - XRP/USDT:USDT
      - DOGE/USDT:USDT
      - ADA/USDT:USDT
      - AVAX/USDT:USDT
      - DOT/USDT:USDT
      - LINK/USDT:USDT
      - MATIC/USDT:USDT
      - UNI/USDT:USDT
      - ATOM/USDT:USDT
      - LTC/USDT:USDT
      - FIL/USDT:USDT
      - APT/USDT:USDT
      - ARB/USDT:USDT
      - OP/USDT:USDT
      - NEAR/USDT:USDT
      - SUI/USDT:USDT
      - TRX/USDT:USDT
      - WIF/USDT:USDT
      - FET/USDT:USDT
      - RENDER/USDT:USDT
      - INJ/USDT:USDT
      - TIA/USDT:USDT
      - SEI/USDT:USDT
      - JUP/USDT:USDT
      - PENDLE/USDT:USDT

trading:
  margin_per_trade: 20.0
  leverage: 5
  use_full_balance: true
  # Entry price gate + limit-order behavior. On a closed-candle signal the live
  # price has usually moved; we ALWAYS place a LIMIT at the signal price (GTX).
  # The live price deviation only determines whether we SKIP entirely:
  #   dev <= entry_max_deviation_pct -> LIMIT at signal price (GTX)
  #   dev  > entry_max_deviation_pct -> SKIP the entry (price moved too far)
  # A resting signal limit auto-cancels after entry_limit_expires_secs.
  entry_max_deviation_pct: 1.0
  entry_limit_expires_secs: 1800
  # Exit price gate + limit-order behavior. Same logic for exits:
  #   dev <= exit_max_deviation_pct -> LIMIT at exit signal price (GTX)
  #   dev  > exit_max_deviation_pct -> SKIP the exit (price moved too far)
  # A resting exit limit auto-cancels after exit_limit_expires_secs.
  exit_max_deviation_pct: 1.0
  exit_limit_expires_secs: 1800
  # Trailing stop-loss (STOP_LIMIT on Binance futures).
  # Activates once price moves favorably by trail_activation_pct.
  # Thereafter, stop price trails at trail_distance_pct below highest price.
  # Uses STOP_LIMIT: when triggered, places a LIMIT at stop price (GTX).
  # Only moves UP (never down). Disabled if trail_distance_pct <= 0.
  trail_activation_pct: 1.0
  trail_distance_pct: 1.5
  trail_limit_expires_secs: 3600

internals:
  process_throttle_secs: 5
  heartbeat_interval: 60

# Set to true for testing without real orders
dry_run: false
dry_run_wallet: 1000.0